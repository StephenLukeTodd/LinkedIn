<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .video-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .controls {
            margin-top: 20px;
        }
        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .video-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 14px;
        }
        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
        }
        .success {
            background: rgba(0, 255, 0, 0.2);
            color: #ccffcc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Random Video Player</h1>
        
        <div class="video-container">
            <video id="videoPlayer" controls>
                Your browser does not support the video tag.
            </video>
            
            <div class="video-info" id="videoInfo" style="display: none;">
                <strong>Now Playing:</strong> <span id="videoName"></span><br>
                <strong>Size:</strong> <span id="videoSize"></span>
            </div>
        </div>
        
        <div class="controls">
            <button id="randomBtn" onclick="loadRandomVideo()">
                🎲 Load Random Video
            </button>
            <button id="listBtn" onclick="showVideoList()">
                📋 Show All Videos
            </button>
        </div>
        
        <div class="status" id="status">
            Ready to play random videos from Azure Blob Storage!
        </div>
        
        <div id="videoList" style="display: none; margin-top: 20px;">
            <h3>Available Videos:</h3>
            <div id="videoListContent"></div>
        </div>
    </div>

    <script>
        let currentVideo = null;

        function updateStatus(message, type = '') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        function showLoading(show = true) {
            const randomBtn = document.getElementById('randomBtn');
            if (show) {
                randomBtn.innerHTML = '<span class="loading"></span> Loading...';
                randomBtn.disabled = true;
            } else {
                randomBtn.innerHTML = '🎲 Load Random Video';
                randomBtn.disabled = false;
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function loadVideo(videoData) {
            const videoPlayer = document.getElementById('videoPlayer');
            const videoInfo = document.getElementById('videoInfo');
            const videoName = document.getElementById('videoName');
            const videoSize = document.getElementById('videoSize');
            
            videoPlayer.src = videoData.url;
            videoName.textContent = videoData.name;
            videoSize.textContent = formatFileSize(videoData.size);
            videoInfo.style.display = 'block';
            
            videoPlayer.load();
            videoPlayer.play().catch(e => {
                console.log('Auto-play failed, user may need to click play:', e);
            });
            
            currentVideo = videoData;
            updateStatus(`Now playing: ${videoData.name}`, 'success');
        }

        async function loadRandomVideo() {
            showLoading(true);
            updateStatus('Fetching random video from Azure Blob Storage...');
            
            try {
                const response = await fetch('/api/random-video');
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                loadVideo(data.video);
            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error('Error loading random video:', error);
            } finally {
                showLoading(false);
            }
        }

        async function showVideoList() {
            const listBtn = document.getElementById('listBtn');
            const videoList = document.getElementById('videoList');
            const videoListContent = document.getElementById('videoListContent');
            
            if (videoList.style.display === 'none') {
                listBtn.innerHTML = '<span class="loading"></span> Loading...';
                listBtn.disabled = true;
                
                try {
                    const response = await fetch('/api/videos');
                    const data = await response.json();
                    
                    if (data.videos.length === 0) {
                        videoListContent.innerHTML = '<p>No MP4 videos found in storage.</p>';
                    } else {
                        let html = '<ul style="list-style: none; padding: 0;">';
                        data.videos.forEach(video => {
                            html += `
                                <li style="margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px;">
                                    <strong>${video.name}</strong> (${formatFileSize(video.size)})
                                    <button onclick="playSpecificVideo('${video.name}')" style="margin-left: 10px; padding: 5px 15px; font-size: 12px;">
                                        ▶️ Play
                                    </button>
                                </li>
                            `;
                        });
                        html += '</ul>';
                        videoListContent.innerHTML = html;
                    }
                    
                    videoList.style.display = 'block';
                    updateStatus(`Found ${data.count} videos`, 'success');
                } catch (error) {
                    updateStatus(`Error loading video list: ${error.message}`, 'error');
                } finally {
                    listBtn.innerHTML = '📋 Hide Videos';
                    listBtn.disabled = false;
                }
            } else {
                videoList.style.display = 'none';
                listBtn.innerHTML = '📋 Show All Videos';
            }
        }

        async function playSpecificVideo(videoName) {
            showLoading(true);
            updateStatus(`Loading video: ${videoName}`);
            
            try {
                // For now, we'll need to implement a specific endpoint for this
                // or modify the random endpoint to accept a video name
                const response = await fetch('/api/videos');
                const data = await response.json();
                const video = data.videos.find(v => v.name === videoName);
                
                if (video) {
                    loadVideo(video);
                } else {
                    throw new Error('Video not found');
                }
            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        // Load a random video on page load
        window.addEventListener('load', () => {
            loadRandomVideo();
        });

        // Handle video errors
        document.getElementById('videoPlayer').addEventListener('error', (e) => {
            updateStatus('Error loading video. The video file may be corrupted or inaccessible.', 'error');
        });
    </script>
</body>
</html>
